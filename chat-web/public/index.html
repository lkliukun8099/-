<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>麦兜错题助手 · 对话式错题分析</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --ink: #1f2430; --sub: #6b7280;
    --brand: #ff7a45; --brand-deep: #e85d26; --accent: #2563eb;
    --ok: #16a34a; --bad: #dc2626; --line: #e5e7eb;
    --radius: 14px; --shadow: 0 4px 18px rgba(20, 30, 60, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(120deg, #ff7a45, #ffb347); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  header .logo { font-size: 26px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header .tag { font-size: 12px; opacity: .92; }
  header .spacer { flex: 1; }
  .btn { border: none; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 14px; transition: .15s; }
  .btn-ghost { background: rgba(255,255,255,.2); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,.35); }
  #engineBadge { font-size: 12px; background: rgba(0,0,0,.18); padding: 4px 10px; border-radius: 20px; }

  main { flex: 1; overflow-y: auto; padding: 18px 12px 8px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; gap: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 12px 14px; border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--panel); box-shadow: var(--shadow); flex-shrink: 0; }
  .msg.user .avatar { order: 2; background: #dbeafe; }

  .card { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; max-width: 88%; }
  .card h3 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .card.error h3 { color: var(--bad); }
  .card.fix h3 { color: var(--accent); }
  .card.train h3 { color: var(--ok); }
  .chip { display: inline-block; background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 5px 10px; margin: 4px 6px 0 0; font-size: 13px; line-height: 1.5; }
  .variant { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: #fcfcfd; }
  .variant .q { font-weight: 600; margin-bottom: 6px; }
  .variant details { margin-top: 6px; font-size: 14px; color: var(--sub); }
  .variant summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .variant .ans { margin-top: 6px; color: var(--ink); background: #f0fdf4; border-left: 3px solid var(--ok); padding: 8px 10px; border-radius: 6px; }
  .engine-note { font-size: 12px; color: var(--sub); margin-top: 6px; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px; }
  .inputbox { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,122,69,.15); }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn-send { background: linear-gradient(120deg, var(--brand), var(--brand-deep)); color: #fff; font-weight: 700; padding: 10px 26px; align-self: flex-end; }
  .btn-send:disabled { opacity: .55; cursor: not-allowed; }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; }
  .examples button { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 12px; font-size: 12px; color: var(--sub); cursor: pointer; }
  .examples button:hover { border-color: var(--brand); color: var(--brand-deep); }

  /* 设置弹窗 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 10; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: min(440px, 92vw); }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  .modal input, .modal select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .modal .row { justify-content: flex-end; margin-top: 16px; }
  .modal .tip { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.6; }
  .typing { color: var(--sub); font-size: 13px; padding: 4px 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">🐷</div>
  <div>
    <h1>麦兜错题助手</h1>
    <div class="tag">发错题 → 找错因 → 给指正 → 出同类题训练</div>
  </div>
  <div class="spacer"></div>
  <span id="engineBadge">本地规则引擎</span>
  <button class="btn btn-ghost" onclick="openSettings()">⚙️ 模型设置</button>
</header>

<main><div class="wrap" id="chat"></div></main>

<footer>
  <div class="inputbox">
    <div class="examples" id="examples"></div>
    <textarea id="qInput" rows="3" placeholder="把做错的题目粘贴/输入到这里…"></textarea>
    <textarea id="aInput" rows="2" placeholder="（可选）你的错误作答，填了分析更准"></textarea>
    <div class="row">
      <span style="font-size:12px;color:var(--sub)">Enter 发送 · Shift+Enter 换行</span>
      <div style="flex:1"></div>
      <button class="btn btn-send" id="sendBtn" onclick="send()">发送分析</button>
    </div>
  </div>
</footer>

<div class="mask" id="mask">
  <div class="modal">
    <h2>⚙️ 大模型设置（可选，BYOK）</h2>
    <label>服务商预设</label>
    <select id="preset" onchange="applyPreset()">
      <option value="deepseek">DeepSeek（推荐，性价比高）</option>
      <option value="glm">智谱 GLM</option>
      <option value="kimi">Kimi（月之暗面）</option>
      <option value="custom">自定义 OpenAI 兼容接口</option>
    </select>
    <label>Base URL</label>
    <input id="baseUrl" placeholder="https://api.deepseek.com" />
    <label>模型名</label>
    <input id="model" placeholder="deepseek-chat" />
    <label>API Key（只存在你浏览器里）</label>
    <input id="apiKey" type="password" placeholder="sk-..." />
    <div class="tip">不填 Key 也能用：系统走<b>本地规则引擎</b>（数学/物理/化学/英语常见错因规则 + 模板变式题）。填了 Key 走大模型深度分析，覆盖全部学科与任意题型。Key 仅保存在浏览器 localStorage，经服务端代理转发给服务商，不落盘。</div>
    <div class="row">
      <button class="btn btn-ghost" style="color:var(--sub);background:#f3f4f6" onclick="closeSettings()">取消</button>
      <button class="btn btn-send" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat");

/* ---------- 设置 ---------- */
const PRESETS = {
  deepseek: { baseUrl: "https://api.deepseek.com", model: "deepseek-chat" },
  glm: { baseUrl: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4-flash" },
  kimi: { baseUrl: "https://api.moonshot.cn/v1", model: "moonshot-v1-8k" },
  custom: { baseUrl: "", model: "" },
};
function openSettings() {
  const s = JSON.parse(localStorage.getItem("maidou_llm") || "{}");
  $("baseUrl").value = s.baseUrl || PRESETS.deepseek.baseUrl;
  $("model").value = s.model || PRESETS.deepseek.model;
  $("apiKey").value = s.apiKey || "";
  $("mask").classList.add("show");
}
function closeSettings() { $("mask").classList.remove("show"); }
function applyPreset() {
  const p = PRESETS[$("preset").value];
  if (p.baseUrl) { $("baseUrl").value = p.baseUrl; $("model").value = p.model; }
}
function saveSettings() {
  localStorage.setItem("maidou_llm", JSON.stringify({
    baseUrl: $("baseUrl").value.trim(), model: $("model").value.trim(), apiKey: $("apiKey").value.trim(),
  }));
  closeSettings(); updateBadge();
}
function getLLM() {
  const s = JSON.parse(localStorage.getItem("maidou_llm") || "{}");
  return s.apiKey ? s : null;
}
function updateBadge() {
  const s = getLLM();
  $("engineBadge").textContent = s ? `大模型：${s.model || "自定义"}` : "本地规则引擎";
}
updateBadge();

/* ---------- 渲染 ---------- */
function renderMath(el) {
  if (!window.katex) return;
  el.querySelectorAll(".k").forEach((node) => {
    try { katex.render(node.dataset.tex, node, { throwOnError: false }); } catch (e) {}
  });
}
function tex(text) {
  return String(text ?? "").replace(/\$([^$]+)\$/g, (_, t) => `<span class="k" data-tex="${t.replace(/"/g, "&quot;")}"></span>`);
}
function esc(t) { return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function addUserMsg(q, a) {
  chat.insertAdjacentHTML("beforeend",
    `<div class="msg user"><div class="avatar">🧑‍🎓</div><div class="bubble">${esc(q)}${a ? "\n\n✏️ 我的作答：" + esc(a) : ""}</div></div>`);
  chat.parentElement.scrollTop = chat.parentElement.scrollHeight;
}
function addTyping() {
  chat.insertAdjacentHTML("beforeend", `<div class="msg" id="typing"><div class="avatar">🐷</div><div class="typing">麦兜正在分析错题…</div></div>`);
  chat.parentElement.scrollTop = chat.parentElement.scrollHeight;
}
function addBotMsg(r) {
  $("typing")?.remove();
  const errChips = (r.errorPoints || []).map((e) => `<span class="chip">${esc(e)}</span>`).join("");
  const variants = (r.variants || []).map((v, i) => `
    <div class="variant">
      <div class="q">变式 ${i + 1}：${tex(esc(v.question))}</div>
      ${v.hint ? `<div style="font-size:13px;color:var(--sub)">💡 ${esc(v.hint)}</div>` : ""}
      <details><summary>查看答案与解析</summary><div class="ans">${tex(esc(v.answer))}</div></details>
    </div>`).join("");
  const note = r.engine === "llm"
    ? `由大模型 ${esc(r.model || "")} 深度分析`
    : `本地规则引擎分析${r.fallbackReason ? "（大模型不可用已降级：" + esc(r.fallbackReason) + "）" : "（配置 API Key 可升级大模型深度分析）"}`;
  chat.insertAdjacentHTML("beforeend", `
    <div class="msg"><div class="avatar">🐷</div>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:88%">
        <div class="card error"><h3>🔍 错误点诊断</h3>${errChips}</div>
        <div class="card fix"><h3>📖 指正与正确解法</h3><div style="line-height:1.8">${tex(esc(r.correction))}</div></div>
        <div class="card train"><h3>💪 同类题训练（${(r.variants || []).length} 道）</h3>${variants}<div class="engine-note">${note}</div></div>
      </div>
    </div>`);
  chat.parentElement.scrollTop = chat.parentElement.scrollHeight;
  renderMath(chat);
}
function addError(msg) {
  $("typing")?.remove();
  chat.insertAdjacentHTML("beforeend", `<div class="msg"><div class="avatar">🐷</div><div class="bubble" style="color:var(--bad)">⚠️ ${esc(msg)}</div></div>`);
}

/* ---------- 发送 ---------- */
async function send() {
  const q = $("qInput").value.trim();
  const a = $("aInput").value.trim();
  if (q.length < 4) { alert("请把题目写完整一点哦"); return; }
  $("sendBtn").disabled = true;
  addUserMsg(q, a);
  $("qInput").value = ""; $("aInput").value = "";
  addTyping();
  try {
    const resp = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, myAnswer: a, llm: getLLM() }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "服务异常");
    addBotMsg(data);
  } catch (e) {
    addError(e.message);
  } finally {
    $("sendBtn").disabled = false;
  }
}
$("qInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---------- 示例 ---------- */
const EXAMPLES = [
  "已知函数f(x)=x²-2ax+3在区间[1,2]上单调递减，求a的取值范围",
  "物块静止在粗糙斜面上，分析它受到的摩擦力方向",
  "配平化学方程式：Fe + O₂ → Fe₃O₄",
  "I _____ (live) in Nanjing since 2015. 时态填空",
];
$("examples").innerHTML = EXAMPLES.map((e) => `<button onclick="$('qInput').value=this.textContent.trim()">${e.slice(0, 18)}…</button>`).join("");

/* ---------- 欢迎语 ---------- */
chat.insertAdjacentHTML("beforeend", `
  <div class="msg"><div class="avatar">🐷</div>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:88%">
      <div class="card fix"><h3>👋 你好，我是麦兜</h3>
      <div style="line-height:1.8">把你<b>做错的题目</b>发给我（最好附上你的错误作答），我会：<br>
      ① 列出你的<b>具体错误点</b>（不是"粗心"这种废话）<br>
      ② 给出<b>指正和正确解法</b><br>
      ③ 出 <b>2~3 道同类变式题</b>让你趁热打铁<br>
      支持数学 / 物理 / 化学 / 英语，点上方示例可快速体验。</div></div>
    </div>
  </div>`);
</script>
</body>
</html>
