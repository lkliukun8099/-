name: CI 测试与打包

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 国内 runner 如需镜像可切换为 rsproxy/tuna；GitHub 托管 runner 直连 crates.io 即可
  CARGO_TERM_COLOR: always

jobs:
  cargo-test:
    name: Rust 全量测试（125 用例）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（MSVC 工具链；runner 自带 VS Build Tools）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 NASM（OpenSSL vendored 编译需要）
        run: choco install nasm -y --no-progress

      - name: Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose

  frontend-test:
    name: 前端测试与类型检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  build-installer:
    name: 打包 Windows 安装包（轻量版）
    needs: [cargo-test, frontend-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（MSVC 工具链）
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 NASM（OpenSSL vendored 编译需要）
        run: choco install nasm -y --no-progress

      - name: Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - run: npm ci

      - name: tauri build（NSIS/MSI）
        run: npm run tauri build
        env:
          # 未申请代码签名证书，关闭签名
          TAURI_SIGNING_PRIVATE_KEY: ""

      # Azure Trusted Signing 云端签名（配置好 vars/secrets 后自动生效，未配置则跳过产出未签名包）
      - name: 代码签名（Azure Trusted Signing）
        if: vars.TS_ACCOUNT_NAME != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TS_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TS_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}/src-tauri/target/release
          files-folder-recurse: true
          files-folder-filter: exe
          files-catalog: "*.exe"

      # ssl.com eSigner 云签名（方案 A，配好 4 个 ES_* secrets 自动生效）
      - name: 代码签名（ssl.com eSigner OV）
        if: secrets.ES_USERNAME != ''
        uses: sslcom/esigner-codesign@main
        with:
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/src-tauri/target/release/bundle/nsis

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: maiduo-installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error
